# Runs the Cloud Functions unit tests (functions/test) on every pull request and
# every push to main (SCRUM-76). They need no Firebase project, no API key and no
# network: the AI model and Firestore are faked.
#
# The Firestore security-rules tests (test/firestore.rules.test.js) need the Firebase
# emulator, so they are run by hand (see that file's header) and not here.
name: Backend tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: functions/package-lock.json
      - run: npm ci
      - run: npm test
